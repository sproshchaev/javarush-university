server:
  port: 8080

spring:
  application:
    name: m5-level-12

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
       ddl-auto: update

# Собственное свойство приложения: базовый адрес внешнего сервиса.
# Читается в UserClient через @Value и в AppConfig при сборке Feign-клиента.
app:
  feign:
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
