spring.application.name=m5-level-05

# Настройки H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Веб-консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Схема создаётся скриптами schema.sql и data.sql
spring.jpa.hibernate.ddl-auto=update

# Вывод генерируемого SQL в логи - без этого демо N+1 не будет видно
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Сессия закрывается вместе с транзакцией, а не в конце HTTP-запроса
spring.jpa.open-in-view=false
