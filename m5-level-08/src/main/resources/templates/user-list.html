<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
    <h1>Список пользователей</h1>

    <p>
        <a th:href="@{/users-web/new}">Добавить нового пользователя</a>
    </p>

    <form th:action="@{/users-web/list}" method="get">
        <label>Поиск по имени:
            <input type="text" name="name" th:value="${searchName}">
        </label>
        <button type="submit">Найти</button>
        <a th:href="@{/users-web/list}">Отмена</a>
    </form>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Возраст</th>
            <th>Телефон</th>
            <th></th>
        </tr>
        <tr th:each="user : ${users}">
             <td th:text="${user.id}"></td>
             <td th:text="${user.name}"></td>
             <td th:text="${user.email}"></td>
             <td th:text="${user.age}"></td>
             <td th:text="${user.phone}"></td>
             <td>
                <a th:href="@{/users-web/{id}(id=${user.id})}">Подробнее</a>
             </td>
        </tr>
    </table>

    <p th:if="${users.isEmpty()}">Пользователи не найдены.</p>

</body>
</html>
