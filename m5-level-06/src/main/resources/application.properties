spring.application.name=m5-level-06

# Настройки H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Веб-консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update

# Вывод генерируемого SQL - без этого демо смотреть не на что
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Сессия закрывается вместе с транзакцией
spring.jpa.open-in-view=false

# Журнал работы прокси: строки Getting transaction for и Completing transaction for
logging.level.org.springframework.transaction.interceptor=TRACE

# Решения самого менеджера транзакций: Initiating transaction commit / rollback,
# а также Suspending / Resuming для REQUIRES_NEW.
# Логгер именуется по фактическому классу менеджера, а не по AbstractPlatformTransactionManager
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
